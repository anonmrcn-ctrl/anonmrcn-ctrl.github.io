<body>

    <header>
        <h1>MARCON</h1>
        <p>Un progetto poetico sul territorio</p>
    </header>

    <main>

        <section>
            <h2>I</h2>

            <p>
                E poi si svegliò<br>
                &nbsp;&nbsp;&nbsp;&nbsp;il Gajo tra i Praelli
            </p>

            <p>
                Si guardò dall'interno<br>
                &nbsp;&nbsp;&nbsp;&nbsp;e loro si salutarono
            </p>

            <p>
                Si guardò dall'esterno<br>
                &nbsp;&nbsp;&nbsp;&nbsp;e si salutarono anche loro
            </p>
        </section>

    </main>
