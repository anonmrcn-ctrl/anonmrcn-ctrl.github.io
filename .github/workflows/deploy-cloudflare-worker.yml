name: Pubblica il Worker Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Pubblica nnmrcn-rete
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Controlla la configurazione
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aggiungi CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nei Secrets del repository, poi esegui nuovamente il workflow."
          fi

      - name: Scarica il repository
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Pubblica il Worker
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy

      - name: Verifica il servizio pubblicato
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://nnmrcn-rete.anonmrcn.workers.dev/api/health
