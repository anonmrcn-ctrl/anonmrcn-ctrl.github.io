name: Sincronizza pagine pubbliche D1

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-pages
  cancel-in-progress: false

jobs:
  generate:
    name: Genera Voci, luoghi e sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Genera le pagine pubblicate in D1
        run: node scripts/generate-public-pages.mjs

      - name: Verifica pagine, SEO e sicurezza del renderer
        run: |
          node scripts/check-seo.mjs
          node --test scripts/public-pages.test.mjs

      - name: Pubblica solo gli aggiornamenti generati
        shell: bash
        run: |
          git add -A -- sitemap.xml public-content-manifest.json voci luoghi
          if git diff --cached --quiet; then
            echo "Le pagine pubbliche sono già aggiornate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna pagine pubbliche da D1"
          git push origin HEAD:main