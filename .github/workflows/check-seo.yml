name: Controlla SEO e contenuti

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verifica metadati e confine CMS
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Controlla la SEO
        run: node scripts/check-seo.mjs

      - name: Controlla il confine contenuti-software
        run: node scripts/check-content-boundary.mjs
