<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f4f1e8">
    <title>Accesso — nnMrcn</title>
    <link rel="icon" href="./favicon.ico?v=logo3" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=logo3">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-logo3.png">
    <script src="./tema.js?v=20261006-map-layers1"></script>
    <link rel="stylesheet" href="./style.css?v=20261006-map-a11y1">
    <link rel="stylesheet" href="./accesso.css?v=20260926-accesso2">
</head>

<body class="pagina-accesso-speciale">
    <main class="accesso-speciale" aria-labelledby="accessoSpecialeTitolo">
        <header class="accesso-speciale-intestazione">
            <p class="accesso-speciale-marchio">nnMrcn</p>
            <h1 id="accessoSpecialeTitolo">Accesso</h1>
            <p>
                Inserisci la password stampata sul foglio, appena sopra il codice QR.
            </p>
        </header>

        <section
            class="accesso-speciale-stato"
            id="accessoVerifica"
            aria-live="polite"
        >
            Verifica del collegamento in corso…
        </section>

        <section id="accessoNegato" hidden>
            <h2>Collegamento necessario</h2>
            <p>
                Questa pagina può essere aperta soltanto dal codice QR presente
                sul foglio consegnato.
            </p>
        </section>

        <section id="accessoPassword" hidden aria-labelledby="accessoPasswordTitolo">
            <h2 id="accessoPasswordTitolo">Password</h2>

            <form class="accesso-speciale-form" id="accessoForm">
                <label for="accessoPasswordInput">Password di accesso</label>
                <input
                    id="accessoPasswordInput"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    inputmode="text"
                    required
                >
                <button type="submit">Accedi</button>
            </form>

            <p
                class="accesso-speciale-messaggio"
                id="accessoMessaggio"
                aria-live="polite"
            ></p>
        </section>

        <article id="messaggioSindaco" hidden aria-labelledby="messaggioSindacoTitolo">
            <p class="accesso-speciale-etichetta">Spazio riservato</p>
            <h2 id="messaggioSindacoTitolo">Messaggio per il sindaco</h2>
            <div class="messaggio-sindaco-corpo" id="messaggioSindacoCorpo"></div>
            <button class="accesso-speciale-esci" id="accessoSindacoEsci" type="button">
                Esci
            </button>
        </article>
    </main>

    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./sessione.js?v=20261002-tour1"></script>
    <script src="./accesso.js?v=20260926-sessione1"></script>
</body>
</html>
