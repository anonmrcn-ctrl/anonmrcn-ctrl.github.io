<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Il progetto — nnMrcn</title>

    <link rel="stylesheet" href="./style.css">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
</head>

<body class="pagina-progetto">

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Apri il menu"
        aria-expanded="false"
        aria-controls="menuPrincipale"
    >
        MENU
    </button>

    <div class="menu-overlay" id="menuOverlay"></div>

    <nav
        class="menu-principale"
        id="menuPrincipale"
        aria-label="Menu principale"
    >
        <button
            class="menu-close"
            id="menuClose"
            aria-label="Chiudi il menu"
        >
            ×
        </button>

        <div class="menu-contenuto">
            <a href="./index.html">
                La poesia
            </a>

            <a href="./autore.html">
                L’autore
            </a>

            <a href="./progetto.html" class="voce-attiva">
                Il progetto
            </a>
        </div>
    </nav>

    <main>

        <section class="progetto">
            <h1 class="titolo-pagina">
                Il progetto
            </h1>
        </section>

        <section class="sezione-mappa">
            <h2>
                I luoghi
            </h2>

            <div
                id="map"
                aria-label="Mappa interattiva dei luoghi del progetto"
            ></div>
        </section>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const menuButton = document.getElementById("menuButton");
        const menuClose = document.getElementById("menuClose");
        const menuPrincipale = document.getElementById("menuPrincipale");
        const menuOverlay = document.getElementById("menuOverlay");

        function apriMenu() {
            menuPrincipale.classList.add("aperto");
            menuOverlay.classList.add("aperto");
            menuButton.setAttribute("aria-expanded", "true");
            document.body.classList.add("menu-aperto");
        }

        function chiudiMenu() {
            menuPrincipale.classList.remove("aperto");
            menuOverlay.classList.remove("aperto");
            menuButton.setAttribute("aria-expanded", "false");
            document.body.classList.remove("menu-aperto");
        }

        menuButton.addEventListener("click", apriMenu);
        menuClose.addEventListener("click", chiudiMenu);
        menuOverlay.addEventListener("click", chiudiMenu);

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                chiudiMenu();
            }
        });


        /* =========================
           MAPPA
           ========================= */

        const map = L.map("map", {
            scrollWheelZoom: true
        }).setView(
            [45.5515, 12.3278],
            13
        );


        /* =========================
           MAPPA SATELLITARE
           ========================= */

        const satelliteOggi = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution:
                    "Tiles &copy; Esri — Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
            }
        );


        /* =========================
           FOTO AEREA 1975
           ========================= */

        const foto1975 = L.imageOverlay(
            "./marcon_1975_web.webp",
            [
                [45.5314854758, 12.2633666786],
                [45.5670779946, 12.3922261726]
            ],
            {
                opacity: 1
            }
        );


        /* =========================
           LAYER TEMPORALI
           ========================= */

        const oggi = L.layerGroup([
            satelliteOggi
        ]);

        const anno1975 = L.layerGroup([
            satelliteOggi,
            foto1975
        ]);

        oggi.addTo(map);


        /* =========================
           SELETTORE TEMPORALE
           ========================= */

        L.control.layers(
            {
                "Oggi": oggi,
                "1975": anno1975
            },
            null,
            {
                collapsed: false
            }
        ).addTo(map);


        /* =========================
           LUOGHI DELLE POESIE
           ========================= */

        const luoghi = [
            {
                nome: "Via Leonardo da Vinci 69",
                lat: 45.55068889,
                lon: 12.29783611
            },
            {
                nome: "Via Piave 33",
                lat: 45.54905278,
                lon: 12.30069444
            },
            {
                nome: "Via Pialoi 15",
                lat: 45.55051667,
                lon: 12.29298889
            },
            {
                nome: "Via Michelangelo 20",
                lat: 45.55116389,
                lon: 12.29913611
            },
            {
                nome: "Via Boschette",
                lat: 45.56014167,
                lon: 12.30475000
            },
            {
                nome: "Via Giovanni Paolo II",
                lat: 45.55928333,
                lon: 12.30306111
            },
            {
                nome: "Viale Don Luigi Sturzo",
                lat: 45.55278333,
                lon: 12.31991667
            },
            {
                nome: "Via Ferrovia 17",
                lat: 45.54861944,
                lon: 12.32383611
            },
            {
                nome: "Via Matteotti 22",
                lat: 45.56081389,
                lon: 12.32211667
            },
            {
                nome: "Via Fornace 28",
                lat: 45.56269722,
                lon: 12.32306111
            },
            {
                nome: "Via Bosco Berizzi",
                lat: 45.53867778,
                lon: 12.29911111
            },
            {
                nome: "Via Altinia",
                lat: 45.53990556,
                lon: 12.30399722
            },
            {
                nome: "Via Bosco Berizzi 2",
                lat: 45.53820278,
                lon: 12.30164722
            },
            {
                nome: "Via Alta 110",
                lat: 45.55623611,
                lon: 12.28671389
            },
            {
                nome: "Via Praello 50",
                lat: 45.53796111,
                lon: 12.32425000
            },
            {
                nome: "Via Praello",
                lat: 45.54035833,
                lon: 12.32820000
            },
            {
                nome: "Via Poianon 14",
                lat: 45.55638056,
                lon: 12.35706667
            },
            {
                nome: "Via Zuccarello",
                lat: 45.53708333,
                lon: 12.36081944
            },
            {
                nome: "Via Cortellazzo 30",
                lat: 45.56294722,
                lon: 12.27724167
            },
            {
                nome: "Via Praello 87",
                lat: 45.53335000,
                lon: 12.32175833
            }
        ];

        luoghi.forEach(function(luogo) {
            const marker = L.marker([
                luogo.lat,
                luogo.lon
            ]).addTo(map);

            marker.bindPopup(`
                <div class="popup-luogo">
                    <strong>${luogo.nome}</strong>
                </div>
            `);
        });
    </script>

</body>
</html>
