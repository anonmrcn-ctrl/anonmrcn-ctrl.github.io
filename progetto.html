<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Il progetto — nnMrcn</title>


    <!-- CSS DEL SITO -->

    <link
        rel="stylesheet"
        href="./style.css"
    >


    <!-- LEAFLET -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body class="pagina-progetto">


    <!-- =========================
         MENU
         ========================= -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Apri il menu"
        aria-expanded="false"
        aria-controls="menuPrincipale"
    >
        MENU
    </button>


    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>


    <nav
        class="menu-principale"
        id="menuPrincipale"
        aria-label="Menu principale"
    >

        <button
            class="menu-close"
            id="menuClose"
            aria-label="Chiudi il menu"
        >
            ×
        </button>


        <div class="menu-contenuto">

            <a href="./index.html">
                La poesia
            </a>

            <a href="./autore.html">
                L’autore
            </a>

            <a
                href="./progetto.html"
                class="voce-attiva"
            >
                Il progetto
            </a>

        </div>

    </nav>


    <!-- =========================
         PAGINA
         ========================= -->

    <main>


        <section class="progetto">

            <h1 class="titolo-pagina">
                Il progetto
            </h1>

        </section>


        <!-- =========================
             MAPPA
             ========================= -->

        <section class="sezione-mappa">

            <h2>
                I luoghi
            </h2>


            <div
                id="map"
                aria-label="Mappa interattiva dei luoghi del progetto"
            ></div>

        </section>


    </main>


    <!-- =========================
         LEAFLET
         ========================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <script>

        /* =========================
           MENU
           ========================= */

        const menuButton =
            document.getElementById("menuButton");

        const menuClose =
            document.getElementById("menuClose");

        const menuPrincipale =
            document.getElementById("menuPrincipale");

        const menuOverlay =
            document.getElementById("menuOverlay");


        function apriMenu() {

            menuPrincipale.classList.add("aperto");

            menuOverlay.classList.add("aperto");

            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );

            document.body.classList.add(
                "menu-aperto"
            );

        }


        function chiudiMenu() {

            menuPrincipale.classList.remove("aperto");

            menuOverlay.classList.remove("aperto");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            document.body.classList.remove(
                "menu-aperto"
            );

        }


        menuButton.addEventListener(
            "click",
            apriMenu
        );


        menuClose.addEventListener(
            "click",
            chiudiMenu
        );


        menuOverlay.addEventListener(
            "click",
            chiudiMenu
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {
                    chiudiMenu();
                }

            }
        );


        /* =========================
           MAPPA
           ========================= */

        const map = L.map(
            "map",
            {
                scrollWheelZoom: false
            }
        ).setView(
            [45.5545, 12.2994],
            13
        );


        /* =========================
           OPENSTREETMAP
           ========================= */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        /* =========================
           LUOGHI
           ========================= */

        const luoghi = [

        ];


        /* =========================
           MARKER
           ========================= */

        luoghi.forEach(
            function(luogo) {

                const marker = L.marker(
                    [
                        luogo.lat,
                        luogo.lon
                    ]
                ).addTo(map);


                marker.bindPopup(
                    `
                    <div class="popup-luogo">

                        <strong>
                            ${luogo.nome}
                        </strong>

                        <p>
                            ${luogo.descrizione}
                        </p>

                    </div>
                    `
                );

            }
        );

    </script>


</body>

</html>
