<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f1e8">
    <title>Amministrazione — nnMrcn</title>
    <link rel="manifest" href="./admin.webmanifest">
    <link rel="apple-touch-icon" href="./logo.PNG">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="admin">
        <h1>Amministrazione</h1>

        <section class="admin-accesso">
            <form id="adminLoginForm">
                <input
                    id="adminToken"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Token amministratore"
                    aria-label="Token amministratore"
                    required
                >
                <button type="submit">Accedi</button>
            </form>

            <p class="admin-status" id="adminStatus" aria-live="polite"></p>
        </section>

        <section class="admin-panel" id="adminPanel" hidden>
            <section class="notifiche-panel" aria-label="Notifiche amministratore">
                <button
                    class="rete-button notifiche-button"
                    id="adminPushButton"
                    type="button"
                    aria-pressed="false"
                >
                    Attiva notifiche
                </button>

                <p
                    class="notifiche-status"
                    id="adminPushStatus"
                    aria-live="polite"
                ></p>
            </section>

            <section class="admin-riepilogo" aria-labelledby="adminRiepilogoTitolo">
                <h2 id="adminRiepilogoTitolo">Riepilogo</h2>
                <div class="admin-riepilogo-griglia">
                    <button type="button" data-admin-filter="pending">
                        <strong id="adminCountPending">0</strong>
                        <span>Da approvare</span>
                    </button>
                    <button type="button" data-admin-filter="pending_delivery">
                        <strong id="adminCountDelivery">0</strong>
                        <span>Da consegnare</span>
                    </button>
                    <button type="button" data-admin-filter="publishable">
                        <strong id="adminCountPublishable">0</strong>
                        <span>Pubblicabili</span>
                    </button>
                    <button type="button" data-admin-filter="public">
                        <strong id="adminCountPublic">0</strong>
                        <span>Nell’archivio</span>
                    </button>
                    <div>
                        <strong id="adminCountContacts">0</strong>
                        <span>Contatti non letti</span>
                    </div>
                    <button type="button" data-admin-memory-filter="pending">
                        <strong id="adminCountMemories">0</strong>
                        <span>Memorie da controllare</span>
                    </button>
                    <button type="button" data-admin-memory-filter="approved">
                        <strong id="adminCountPublicMemories">0</strong>
                        <span>Memorie pubblicate</span>
                    </button>
                </div>
            </section>

            <section class="admin-strumenti" aria-labelledby="adminStrumentiTitolo">
                <h2 id="adminStrumentiTitolo">Strumenti</h2>
                <label for="adminSearch">Cerca nei messaggi mostrati</label>
                <input
                    id="adminSearch"
                    type="search"
                    autocomplete="off"
                    placeholder="Testo, mittente o destinatario"
                >
                <div class="admin-export-actions">
                    <button id="adminExportCsv" type="button">Esporta CSV</button>
                    <button id="adminExportJson" type="button">Esporta JSON</button>
                </div>
                <p class="admin-export-status" id="adminExportStatus" aria-live="polite"></p>
            </section>

            <section class="admin-contatti" aria-labelledby="adminContattiTitolo">
                <h2 id="adminContattiTitolo">Messaggi diretti</h2>
                <div class="admin-list" id="adminContactList"></div>
            </section>

            <section class="admin-memorie" id="adminMemorie" aria-labelledby="adminMemorieTitolo">
                <h2 id="adminMemorieTitolo">Memorie degli abitanti</h2>
                <div class="admin-filter">
                    <label for="adminMemoryStatusFilter">Mostra:</label>
                    <select id="adminMemoryStatusFilter">
                        <option value="pending">Da controllare</option>
                        <option value="approved">Pubblicate</option>
                        <option value="rejected">Non approvate</option>
                        <option value="all">Tutte</option>
                    </select>
                    <button id="adminMemoryRefresh" type="button">Aggiorna</button>
                </div>
                <div class="admin-list" id="adminMemoryList"></div>
            </section>

            <div class="admin-filter">
                <label for="adminStatusFilter">Mostra:</label>

                <select id="adminStatusFilter">
                    <option value="active">Da gestire</option>
                    <option value="pending">Online da approvare</option>
                    <option value="pending_delivery">Lettere da consegnare</option>
                    <option value="approved">Online approvati</option>
                    <option value="read">Online letti</option>
                    <option value="publishable">Pronti per l’archivio</option>
                    <option value="public">Pubblicati nell’archivio</option>
                    <option value="delivered">Lettere consegnate</option>
                    <option value="rejected">Rifiutati</option>
                    <option value="all">Tutti</option>
                </select>

                <button id="adminRefresh" type="button">Aggiorna</button>
            </div>

            <div class="admin-list" id="adminList"></div>
        </section>
    </main>

    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./notifiche.js"></script>
    <script src="./admin.js"></script>
</body>
</html>
